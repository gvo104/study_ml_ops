name: Kubernetes Manifests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy.yml'

env:
  ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
  ARGOCD_USERNAME: ${{ secrets.ARGOCD_USERNAME }}
  ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
  ARGOCD_APP: ml-team-app

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Render Kustomize manifests
        run: kubectl kustomize k8s/base > rendered-manifests.yml

      - name: Validate rendered manifests
        run: kubectl apply --dry-run=client --validate=false -f rendered-manifests.yml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-k8s-manifests
          path: rendered-manifests.yml

  argocd-sync:
    name: Sync Argo CD on main
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Install Argo CD CLI
        if: env.ARGOCD_SERVER != '' && env.ARGOCD_USERNAME != '' && env.ARGOCD_PASSWORD != ''
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 0755 argocd /usr/local/bin/argocd

      - name: Sync application
        if: env.ARGOCD_SERVER != '' && env.ARGOCD_USERNAME != '' && env.ARGOCD_PASSWORD != ''
        run: |
          argocd login "${ARGOCD_SERVER}" \
            --username "${ARGOCD_USERNAME}" \
            --password "${ARGOCD_PASSWORD}" \
            --grpc-web
          argocd app sync "${ARGOCD_APP}" --grpc-web
          argocd app wait "${ARGOCD_APP}" --health --sync --timeout 300 --grpc-web

      - name: Skip sync when secrets are absent
        if: env.ARGOCD_SERVER == '' || env.ARGOCD_USERNAME == '' || env.ARGOCD_PASSWORD == ''
        run: echo "ARGOCD_SERVER, ARGOCD_USERNAME, or ARGOCD_PASSWORD is not configured; skipping Argo CD sync."

  notify:
    name: Notify on failure
    needs:
      - validate
      - argocd-sync
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Send notification
        run: |
          echo "Deployment failed! Check the workflow logs for details."
