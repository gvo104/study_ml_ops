name: CI/CD for ML-Ops Pipeline

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'tests/**'

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install flake8 black isort

      - name: Check code style
        run: |
          flake8 src/ --max-line-length=127
          black --check src/
          isort --check src/

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [tests, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MLflow image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile.mlflow
          push: false
          tags: ghcr.io/${{ github.repository }}/mlflow:latest

  mlflow-integration-test:
    name: MLflow Integration Test
    runs-on: ubuntu-latest
    needs: [build-docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start MinIO
        uses: supercharge/minio-github-action@v2.0
        with:
          version: 'RELEASE.2023-01-12T17-58-49Z'
          root-user: minioadmin
          root-password: minioadmin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install boto3

      - name: Setup S3 environment
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
          MLFLOW_S3_ENDPOINT_URL: http://minio:9000
        run: |
          aws --endpoint-url=http://minio:9000 s3 mb s3://ml-team || true

      - name: Test MLflow connection
        env:
          MLFLOW_S3_ENDPOINT_URL: http://minio:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python -c "import mlflow; print('MLflow imported successfully')"
