model:
  name: xgboost
  n_estimators: 150
  max_depth: 4
  learning_rate: 0.2

features:
  tfidf_max_features: 5000
  ngram_range: [1, 2]
  svd_components: 300

training:
  test_size: 0.2
  random_state: 101
  oversample: true

experiment:
  run_name: xgboost_shallow_fast
  save_local_artifacts: false
  description: Shallow fast XGBoost for quick iteration
