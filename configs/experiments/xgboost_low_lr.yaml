model:
  name: xgboost
  n_estimators: 400
  max_depth: 6
  learning_rate: 0.03

features:
  tfidf_max_features: 5000
  ngram_range: [1, 2]
  svd_components: 300

training:
  test_size: 0.2
  random_state: 101
  oversample: true

experiment:
  run_name: xgboost_low_lr
  save_local_artifacts: false
  description: More trees with very low learning rate
