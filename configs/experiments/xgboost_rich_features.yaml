model:
  name: xgboost
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.1

features:
  tfidf_max_features: 8000
  ngram_range: [1, 3]
  svd_components: 400

training:
  test_size: 0.2
  random_state: 101
  oversample: true

experiment:
  run_name: xgboost_rich_features
  save_local_artifacts: false
  description: Richer TF-IDF (1-3 grams) and higher SVD dimension
