model:
  name: random_forest
  n_estimators: 200
  max_depth: 20

features:
  tfidf_max_features: 5000
  ngram_range: [1, 2]
  svd_components: 300

training:
  test_size: 0.2
  random_state: 101
  oversample: true

experiment:
  run_name: random_forest_baseline
  save_local_artifacts: false
  description: Random forest on reduced features
