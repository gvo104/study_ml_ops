model:
  name: xgboost
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.1

features:
  tfidf_max_features: 5000
  ngram_range: [1, 2]
  svd_components: 200

training:
  test_size: 0.2
  random_state: 101
  oversample: true

experiment:
  run_name: xgboost_svd200
  save_local_artifacts: false
  description: XGBoost with fewer SVD components (faster, less dense)
