apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: ml-team
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: ml-team
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: Never
      containers:
      - name: minio-init
        image: amazon/aws-cli:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: AWS_SECRET_ACCESS_KEY
        command: ["/bin/sh", "-c"]
        args:
          - |
            until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do
              echo "Waiting for MinIO..."
              sleep 2
            done
            aws --endpoint-url http://minio:9000 s3 mb s3://ml-team || true
            echo "Bucket ml-team is ready"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      initContainers:
      - name: wait-for-minio-bucket
        image: amazon/aws-cli:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: AWS_SECRET_ACCESS_KEY
        command: ["/bin/sh", "-c"]
        args:
          - |
            until aws --endpoint-url http://minio:9000 s3 ls s3://ml-team >/dev/null 2>&1; do
              echo "Waiting for bucket ml-team..."
              sleep 2
            done
      containers:
      - name: mlflow
        image: mlflow:latest
        imagePullPolicy: IfNotPresent
        command: ["mlflow"]
        args:
        - server
        - --backend-store-uri
        - sqlite:////mlflow_data/mlflow.db
        - --default-artifact-root
        - s3://ml-team/mlflow-artifacts
        - --host
        - 0.0.0.0
        - --port
        - "5000"
        - --allowed-hosts
        - localhost,127.0.0.1,mlflow,mlflow:5000,mlflow.ml-team.svc,mlflow.ml-team.svc.cluster.local
        - --disable-security-middleware
        ports:
        - containerPort: 5000
          name: server
        env:
        - name: MLFLOW_S3_ENDPOINT_URL
          valueFrom:
            configMapKeyRef:
              name: minio-config
              key: MLFLOW_S3_ENDPOINT_URL
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_DEFAULT_REGION
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: AWS_DEFAULT_REGION
        - name: MLFLOW_SERVER_ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MLFLOW_SERVER_ALLOWED_HOSTS
        volumeMounts:
        - name: mlflow-data
          mountPath: /mlflow_data
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: mlflow-data
        persistentVolumeClaim:
          claimName: mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ml-team
spec:
  selector:
    app: mlflow
  ports:
  - name: server
    port: 5000
    targetPort: 5000
  type: ClusterIP
