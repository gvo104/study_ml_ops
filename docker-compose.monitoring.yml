services:
  drift-v2-exporter:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: drift-v2-exporter
    restart: unless-stopped
    ports:
      - "9208:9208"
    command: ["uvicorn", "drift_v2.monitoring.app:app", "--host", "0.0.0.0", "--port", "9208"]
    volumes:
      - ./drift_v2/artifacts/runs:/app/drift_v2/artifacts/runs:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      - drift-v2-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/drift_v2_rules.yml:/etc/prometheus/drift_v2_rules.yml:ro

  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
