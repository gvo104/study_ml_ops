version: '3.8'

services:
  # === S3-хранилище (MinIO) ===
  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Веб-консоль
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 3

  # === Автосоздание бакета при первом старте ===
  minio-init:
    image: amazon/aws-cli
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    entrypoint: |
      sh -c "
      aws --endpoint-url http://minio:9000 s3 mb s3://ml-team || true
      echo 'Bucket ml-team готов'
      "
    networks:
      - default

  # === MLflow Tracking Server ===
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow   # Создадим ниже
    container_name: mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - mlflow_data:/mlflow_data
    command: >
      mlflow server
        --backend-store-uri sqlite:////mlflow_data/mlflow.db
        --default-artifact-root s3://ml-team/mlflow-artifacts
        --host 0.0.0.0
        --port 5000
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio_data:
  mlflow_data: